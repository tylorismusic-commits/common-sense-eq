name: macOS

# Compile and test the portable half of the plug-in on Apple Silicon.
#
# The editor host is still X11, so the CLAP/LV2 UI targets are skipped on macOS
# (see CMakeLists.txt).  This job proves the DSP, parameters, presets and the
# cairo panel compile and run with AppleClang, and leaves a rendered panel PNG
# as the artifact to eyeball.  Once the Cocoa view replaces editor.cpp this
# workflow grows the VST3/AU projections.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-14
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install cmake pkg-config cairo freetype lv2 lilv
          pkg-config --modversion cairo lv2
          cmake --version | head -1

      - name: Configure
        run: >
          cmake -S . -B build-macos
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build-macos

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Render panel (cairo only, no window system)
        run: ./build-macos/common_sense_eq_panel_preview build-macos/panel-preview.png

      - name: Upload panel preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-panel-preview
          path: build-macos/panel-preview.png
          if-no-files-found: warn
